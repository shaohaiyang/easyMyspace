# ==============================================================================
# easyMyspace — workmux 项目配置
# 兼容 tmux 操作习惯 · Catppuccin Mocha 风格
#
# tmux 键位（Ctrl+Z 前缀、u/v 分屏、h/j/k/l 导航）在 tmux.conf 中定义，
# 不受此配置影响。此配置只控制 workmux 的行为：
#   - pane 布局（对应 u/v 分屏习惯）
#   - 合并策略、基准分支
#   - 创建后自动操作
# ==============================================================================

#-------------------------------------------------------------------------------
# Agent
#-------------------------------------------------------------------------------

# 默认 AI agent（opencode 已安装，与项目一致）
agent: opencode

#-------------------------------------------------------------------------------
# Git
#-------------------------------------------------------------------------------

# 合并策略（与 gitconfig pull.rebase=true 一致）
merge_strategy: rebase

# 默认基准分支（匹配 git init.defaultBranch）
main_branch: main
base_branch: main

#-------------------------------------------------------------------------------
# 命名
#-------------------------------------------------------------------------------

# 派生名策略：取分支名的最后一段（如 feat/login → login）
worktree_naming: basename

# tmux 窗口名前缀
window_prefix: wm-

# 工作树目录：放在项目下的 .worktrees 目录（而非上级目录）
worktree_dir: .worktrees

#-------------------------------------------------------------------------------
# Tmux
#-------------------------------------------------------------------------------

# 模式：window（在当前 session 新建 tmux 窗口）
mode: window

# 新窗口位置：最右侧（与 tmux n/p 切换窗口习惯一致）
window_placement: rightmost

# 在 tmux 窗口名中显示 agent 状态图标
status_format: true

# 默认 pane 布局（对应 tmux 分屏习惯）
# v = 垂直分屏（上下），u = 水平分屏（左右）
# 布局：agent 在上方（主 pane），shell 在下方（30%），
# 类似 tmux: Ctrl+Z v 先分一个 shell 在下边
panes:
  - command: <agent>
    focus: true
  - split: vertical
    size: 10
    command: zsh

#-------------------------------------------------------------------------------
# 钩子
#-------------------------------------------------------------------------------

post_create: []

#-------------------------------------------------------------------------------
# 文件
#-------------------------------------------------------------------------------

files: {}
